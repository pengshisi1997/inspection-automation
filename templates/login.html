<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器人巡检自动化 - 登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>巡检自动化测试</h1>
        <div class="input-group">
            <label for="ip-input">机器人IP地址</label>
            <input type="text" id="ip-input" placeholder="例如：192.168.1.100" value="192.168.17.">
        </div>
        <button id="enter-btn" class="btn btn-primary">进入机器人测试主页</button>
    </div>
    
    <script>
        document.getElementById('enter-btn').addEventListener('click', function() {
            const ip = document.getElementById('ip-input').value;
            if (!ip) {
                alert('请输入机器人IP地址');
                return;
            }
            
            // 绑定IP并跳转到主页面
            fetch('/bind_ip', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ip: ip })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/main';
                } else {
                    alert(data.error || '绑定IP失败');
                }
            })
            .catch(error => {
                alert('网络请求失败，请检查网络连接');
            });
        });
    </script>
</body>
</html>
