<div class="test-ui">
    <h2>传感器检测</h2>
    <p>检测机器人的各种传感器是否正常工作</p>
    
    <!-- 传感器列表 -->
    <div class="sensor-list">
        <h3>传感器状态</h3>
        {% for sensor_task in get_subtasks(current_model, 'sensor') %}
            {% set sensor = sensor_task.id %}
                <div class="sensor-item" data-sensor="{{ sensor }}">
                    <span class="sensor-name">{{ sensor_task.label }}:</span>
                    <span class="sensor-status" id="{{ sensor | replace('_', '-') }}">未检测</span>
                </div>
        {% endfor %}
    </div>
    
    <div class="ui-buttons">
        <button class="btn btn-primary" onclick="startTest('sensor')">开始测试</button>
    </div>
    <div class="test-time" id="test-time"></div>
</div>

<style>
    .sensor-list {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background-color: #f9f9f9;
    }
    .sensor-list h3 {
        margin-top: 0;
        color: #555;
        font-size: 16px;
        margin-bottom: 15px;
    }
    .sensor-item {
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        padding: 7px 8px;
        border-left: 4px solid transparent;
        border-bottom: 1px solid #eee;
    }
    .sensor-item:last-child {
        border-bottom: none;
    }
    .sensor-name {
        font-weight: bold;
        color: #333;
    }
    .sensor-status {
        color: #666;
    }
    .sensor-item.is-failed {
        border-left-color: #dc3545;
        background-color: #fff1f0;
    }
    .sensor-item.is-failed .sensor-name,
    .sensor-item.is-failed .sensor-status {
        color: #c62828;
        font-weight: 600;
    }
    .test-time {
        margin-top: 20px;
        font-size: 14px;
        color: #999;
        text-align: right;
    }
</style>

<script>
    function startTest(testType) {
        showLoading();
        
        fetch('/start_test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ test_type: testType })
        })
        .then(response => response.json())
        .then(data => {
            hideLoading();
            if (data.success && data.sensor_info) {
                updateSensorInfo(data.sensor_info, data.item_results);
                // 使用后端返回的result字段，而不是自己判断
                const result = data.result || 'success';
                
                // 自动结束测试并保存结果
                fetch('/end_test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ test_type: testType, result: result })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateTestStatus(testType, result);
                        // 自动跳转到下一个测试项目
                        const nextTestType = getNextTestType(testType);
                        if (nextTestType) {
                            setTimeout(() => {
                                navigateToTest(nextTestType);
                            }, 5000); // 延迟5000ms跳转，给用户时间看到测试结果
                        }
                    }
                });
            }
        })
        .catch(error => {
            hideLoading();
            console.error('请求出错:', error);
        });
    }
    
    function updateSensorInfo(sensorInfo, itemResults) {
        // 遍历传感器信息对象的所有键
        Object.keys(sensorInfo).forEach(key => {
            // 跳过result和time字段
            if (key !== 'result' && key !== 'item_results' && key !== 'time' && key !== 'data') {
                // 直接使用key作为元素ID
                const elementId = key.replace(/_/g, '-');
                const sensorEl = document.getElementById(elementId);
                if (sensorEl) {
                    let value = sensorInfo[key];
                    // 对拾音器进行特殊处理
                    if (key === 'microphone') {
                        if (value === true) {
                            sensorEl.textContent = '正常';
                        } else if (value === false) {
                            sensorEl.textContent = '异常';
                        } else {
                            sensorEl.textContent = '无数据';
                        }
                    } else if (key === 'o2') {
                        // 对于O2，同时显示O2和CO的值
                        let coValue = sensorInfo['co'] || (sensorInfo.data && sensorInfo.data['co']);
                        if (coValue !== undefined) {
                            sensorEl.textContent = `O2: ${value || '无数据'}, CO: ${coValue}`;
                        } else {
                            sensorEl.textContent = value ? JSON.stringify(value) : '无数据';
                        }
                    } else if (key === 'co') {
                        // CO已经在O2中显示了，跳过
                    } else {
                        sensorEl.textContent = value ? JSON.stringify(value) : '无数据';
                    }
                }
            }
        });
        
        // 处理嵌套在data字段中的传感器数据
        if (sensorInfo.data) {
            Object.keys(sensorInfo.data).forEach(key => {
                const elementId = key.replace(/_/g, '-');
                const sensorEl = document.getElementById(elementId);
                if (sensorEl) {
                    let value = sensorInfo.data[key];
                    // 对拾音器进行特殊处理
                    if (key === 'microphone') {
                        if (value === true) {
                            sensorEl.textContent = '正常';
                        } else if (value === false) {
                            sensorEl.textContent = '异常';
                        } else {
                            sensorEl.textContent = '无数据';
                        }
                    } else if (key === 'o2') {
                        // 对于O2，同时显示O2和CO的值
                        let coValue = sensorInfo.data['co'];
                        if (coValue !== undefined) {
                            sensorEl.textContent = `O2: ${value || '无数据'}, CO: ${coValue}`;
                        } else {
                            sensorEl.textContent = value ? JSON.stringify(value) : '无数据';
                        }
                    } else if (key === 'co') {
                        // CO已经在O2中显示了，跳过
                    } else {
                        sensorEl.textContent = value ? JSON.stringify(value) : '无数据';
                    }
                }
            });
        }
        applySensorItemResults(itemResults || sensorInfo.item_results || {});
    }

    function applySensorItemResults(itemResults) {
        document.querySelectorAll('.sensor-item[data-sensor]').forEach(item => {
            const status = itemResults[item.dataset.sensor];
            const failed = status === 'failed';
            item.classList.toggle('is-failed', failed);

            const statusElement = item.querySelector('.sensor-status');
            if (failed && statusElement && statusElement.textContent === '未检测') {
                statusElement.textContent = '无数据';
            }
        });
    }
    

    
    // 页面加载时从JSON读取测试状态
    document.addEventListener('DOMContentLoaded', function() {
        // 读取传感器信息
        fetch('/get_sensor_info')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.sensor_info) {
                updateSensorInfo(data.sensor_info);
                // 显示测试时间
                const testTimeElement = document.getElementById('test-time');
                if (testTimeElement && data.sensor_info.time) {
                    testTimeElement.textContent = `测试时间: ${data.sensor_info.time}`;
                }
            }
        })
        .catch(error => {
            console.log('获取传感器信息失败:', error);
        });
        
        // 同时获取并更新测试状态
        fetch('/get_test_status')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.test_status) {
                if (typeof updateAllTestStatus === 'function') {
                    updateAllTestStatus(data.test_status);
                }
                if (data.test_times && data.test_times.sensor) {
                    const testTimeElement = document.getElementById('test-time');
                    if (testTimeElement) {
                        testTimeElement.textContent = `测试时间: ${data.test_times.sensor}`;
                    }
                }
            }
        })
        .catch(error => {
            console.log('获取测试状态失败:', error);
        });
    });
</script>
