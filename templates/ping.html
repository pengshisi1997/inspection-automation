<div class="test-ui">
    <h2>网络Ping测试</h2>
    <p>测试网络设备的连通性和延迟</p>
    
    <!-- 网络设备列表 -->
    <div class="sensor-list">
        <h3>设备状态</h3>
        {% for ping_task in get_subtasks(current_model, 'ping') %}
            {% set ip = ping_task.id %}
                <div class="sensor-item" data-ip="{{ ip }}">
                    <span class="sensor-name">{{ ping_task.label }}:</span>
                    <span class="sensor-status">未检测</span>
                </div>
        {% endfor %}
    </div>
    
    <div class="ui-buttons">
        <button class="btn btn-primary" onclick="startTest('ping')">开始测试</button>
    </div>
    <div class="test-time" id="test-time"></div>
</div>

<style>
    .sensor-list {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background-color: #f9f9f9;
    }
    .sensor-list h3 {
        margin-top: 0;
        color: #555;
        font-size: 16px;
        margin-bottom: 15px;
    }
    .sensor-item {
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        padding: 7px 8px;
        border-left: 4px solid transparent;
        border-bottom: 1px solid #eee;
    }
    .sensor-item:last-child {
        border-bottom: none;
    }
    .sensor-name {
        font-weight: bold;
        color: #333;
    }
    .sensor-status {
        color: #666;
    }
    .sensor-item.is-failed {
        border-left-color: #dc3545;
        background-color: #fff1f0;
    }
    .sensor-item.is-failed .sensor-name,
    .sensor-item.is-failed .sensor-status {
        color: #c62828;
        font-weight: 600;
    }
    .test-time {
        margin-top: 20px;
        font-size: 14px;
        color: #999;
        text-align: right;
    }
</style>

<script>
    function startTest(testType) {
        showLoading();
        
        fetch('/start_test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ test_type: testType })
        })
        .then(response => response.json())
        .then(data => {
            hideLoading();
            if (data.success && data.ping_info) {
                updatePingInfo(data.ping_info, data.item_results);
                // 更新左边栏测试状态
                if (data.result) {
                    updateTestStatus(testType, data.result);
                    // 自动跳转到下一个测试项目
                    const nextTestType = getNextTestType(testType);
                    if (nextTestType) {
                        setTimeout(() => {
                            navigateToTest(nextTestType);
                        }, 5000); // 延迟5000ms跳转，给用户时间看到测试结果
                    }
                }
            }
        })
        .catch(error => {
            hideLoading();
            console.error('请求出错:', error);
        });
    }
    
    function updatePingInfo(pingInfo, itemResults) {
        console.log('Ping测试结果:', pingInfo);
        
        const sensorItems = document.querySelectorAll('.sensor-item');
        sensorItems.forEach(item => {
            const ip = item.dataset.ip;
            const statusElement = item.querySelector('.sensor-status');
            if (!ip) return;
            const hasResult = ip in pingInfo;
            const value = hasResult ? pingInfo[ip] : null;
            statusElement.textContent = hasResult ? (value || '超时') : '未检测';

            const serverStatus = itemResults && itemResults[ip];
            const numericDelay = typeof value === 'string'
                ? Number(value.replace(/ms$/i, '').trim())
                : Number(value);
            const inferredFailure = hasResult
                && (value === null || value === '' || !Number.isFinite(numericDelay) || numericDelay > 100);
            item.classList.toggle(
                'is-failed',
                serverStatus === 'failed' || (!serverStatus && inferredFailure)
            );
        });
    }
    
    function endTest(testType, result) {
        fetch('/end_test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ test_type: testType, result: result })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                updateTestStatus(testType, result);
                // 自动跳转到下一个测试项目
                const nextTestType = getNextTestType(testType);
                if (nextTestType) {
                    setTimeout(() => {
                        navigateToTest(nextTestType);
                    }, 5000); // 延迟5000ms跳转，给用户时间看到测试结果
                }
            }
        });
    }
    
    // 页面加载时从JSON读取ping信息
    document.addEventListener('DOMContentLoaded', function() {
        // 读取ping信息
        fetch('/get_ping_info')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.ping_info) {
                updatePingInfo(data.ping_info, data.item_results);
                // 显示测试时间
                const testTimeElement = document.getElementById('test-time');
                if (testTimeElement && data.test_time) {
                    testTimeElement.textContent = `测试时间: ${data.test_time}`;
                }
            }
        })
        .catch(error => {
            console.log('获取ping信息失败:', error);
        });
        
        // 同时获取并更新测试状态
        fetch('/get_test_status')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.test_status) {
                if (typeof updateAllTestStatus === 'function') {
                    updateAllTestStatus(data.test_status);
                }
                if (data.test_times && data.test_times.ping) {
                    const testTimeElement = document.getElementById('test-time');
                    if (testTimeElement) {
                        testTimeElement.textContent = `测试时间: ${data.test_times.ping}`;
                    }
                }
            }
        })
        .catch(error => {
            console.log('获取测试状态失败:', error);
        });
    });
</script>
